<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Batch 4 妙笔论文审查消息面板</title>
  <style>
    :root {
      --ink: #1c241f;
      --muted: #607067;
      --paper: #f8f1e4;
      --panel: rgba(255, 250, 239, .88);
      --line: rgba(48, 67, 55, .18);
      --green: #1d6b4f;
      --amber: #b26b15;
      --red: #9b2f24;
      --blue: #235c9d;
      --shadow: 0 18px 45px rgba(36, 45, 38, .16);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      font-family: ui-serif, Georgia, 'Times New Roman', 'Noto Serif SC', serif;
      min-height: 100vh;
      background:
        radial-gradient(circle at 8% 12%, rgba(43, 123, 91, .18), transparent 28rem),
        radial-gradient(circle at 90% 0%, rgba(178, 107, 21, .16), transparent 25rem),
        linear-gradient(135deg, #f7ead4 0%, #e7efe5 53%, #eadcc6 100%);
    }
    header {
      padding: 34px clamp(20px, 4vw, 56px) 18px;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
    }
    h1 { margin: 0; font-size: clamp(30px, 4vw, 56px); letter-spacing: -.04em; line-height: .94; }
    .subtitle { color: var(--muted); max-width: 760px; margin-top: 12px; font-size: 16px; line-height: 1.6; }
    .status-pill { border: 1px solid var(--line); background: var(--panel); padding: 10px 14px; border-radius: 999px; box-shadow: var(--shadow); white-space: nowrap; }
    main { padding: 18px clamp(20px, 4vw, 56px) 48px; display: grid; grid-template-columns: minmax(280px, 380px) 1fr; gap: 22px; }
    .card { background: var(--panel); border: 1px solid var(--line); border-radius: 28px; box-shadow: var(--shadow); backdrop-filter: blur(8px); }
    .sidebar { padding: 18px; align-self: start; position: sticky; top: 16px; }
    .workflow-list { display: grid; gap: 10px; }
    .workflow-button { width: 100%; text-align: left; border: 1px solid var(--line); background: rgba(255,255,255,.45); border-radius: 18px; padding: 14px; cursor: pointer; transition: transform .18s ease, border-color .18s ease, background .18s ease; color: var(--ink); }
    .workflow-button:hover, .workflow-button.active { transform: translateY(-1px); border-color: rgba(29, 107, 79, .45); background: rgba(232, 246, 236, .72); }
    .workflow-button strong { display:block; font-size: 14px; margin-bottom: 6px; overflow-wrap: anywhere; }
    .workflow-button span { color: var(--muted); font-size: 12px; display: block; }
    .content { display: grid; gap: 18px; }
    .hero { padding: 24px; display: grid; gap: 14px; }
    .paper-title { font-size: clamp(22px, 3vw, 38px); line-height: 1.05; letter-spacing: -.03em; margin: 0; }
    .meta-grid { display:grid; grid-template-columns: repeat(4, minmax(120px, 1fr)); gap: 10px; }
    .metric { border: 1px solid var(--line); background: rgba(255,255,255,.42); border-radius: 18px; padding: 13px; min-height: 78px; }
    .metric label { display:block; color: var(--muted); font-size: 12px; margin-bottom: 8px; }
    .metric b { font-size: 17px; overflow-wrap: anywhere; }
    .ok { color: var(--green); } .warn { color: var(--amber); } .bad { color: var(--red); } .info { color: var(--blue); }
    .columns { display:grid; grid-template-columns: 1fr 1fr; gap: 18px; }
    section.card { padding: 18px; min-width: 0; }
    h2 { margin: 0 0 12px; font-size: 18px; letter-spacing: -.02em; }
    .timeline { display: grid; gap: 10px; max-height: 420px; overflow: auto; padding-right: 4px; }
    .item { border-left: 3px solid rgba(29,107,79,.42); padding: 10px 12px; border-radius: 12px; background: rgba(255,255,255,.38); }
    .item small { color: var(--muted); display: block; margin-bottom: 4px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .item code, code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; background: rgba(0,0,0,.055); padding: 2px 5px; border-radius: 6px; overflow-wrap: anywhere; }
    pre { white-space: pre-wrap; word-break: break-word; overflow-wrap: anywhere; background: rgba(21, 29, 25, .075); padding: 12px; border-radius: 16px; max-height: 340px; overflow: auto; font-size: 12px; }
    .artifact { display: grid; gap: 5px; padding: 10px; border-radius: 14px; background: rgba(255,255,255,.36); border: 1px solid var(--line); margin-bottom: 8px; }
    .stop-banner { border: 1px solid rgba(155,47,36,.28); background: rgba(155,47,36,.09); color: var(--red); border-radius: 18px; padding: 12px 14px; line-height: 1.5; }
    .actions { display:flex; gap:10px; flex-wrap: wrap; align-items:center; }
    button.refresh, button.action { border:0; color:white; background: var(--green); padding: 10px 14px; border-radius: 999px; cursor:pointer; }
    button.action.warn { background: var(--amber); }
    button.action.blue { background: var(--blue); }
    @media (max-width: 980px) { main { grid-template-columns: 1fr; } .sidebar { position: static; } .columns, .meta-grid { grid-template-columns: 1fr; } header { align-items: flex-start; flex-direction: column; } }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Batch 4<br/>论文审查消息面板</h1>
      <div class="subtitle">从当前文件夹读取 <code>.miaobi-paper-review</code>，展示妙笔式 <code>workflow_context</code>、<code>state_executions</code>、<code>chat_messages</code>、<code>agent_logs</code>、<code>artifacts</code> 和实时 WebSocket 快照。</div>
    </div>
    <div id="health" class="status-pill">连接中...</div>
  </header>
  <main>
    <aside class="card sidebar">
      <div class="actions"><button class="refresh" onclick="loadWorkflows()">刷新</button><span id="wsState" class="status-pill">WS 未连接</span></div>
      <h2 style="margin-top:18px">工作流</h2>
      <div id="workflowList" class="workflow-list"></div>
    </aside>
    <div class="content">
      <div id="hero" class="card hero">选择左侧工作流。</div>
      <div class="columns">
        <section class="card"><h2>State Executions</h2><div id="states" class="timeline"></div></section>
        <section class="card"><h2>Chat Messages</h2><div id="chat" class="timeline"></div></section>
      </div>
      <div class="columns">
        <section class="card"><h2>Rework Tickets / 打回</h2><div id="rework"></div></section>
        <section class="card"><h2>Artifacts</h2><div id="artifacts"></div></section>
      </div>
      <section class="card"><h2>Events / Agent Logs</h2><div id="events" class="timeline"></div></section>
      <section class="card"><h2>Workflow Context</h2><pre id="context">{}</pre></section>
    </div>
  </main>
  <script>
    let selectedId = null;
    let socket = null;

    const $ = (id) => document.getElementById(id);
    const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (ch) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    const tone = (v) => v === true ? 'ok' : v === false ? 'bad' : /blocked|failed|rework/.test(String(v)) ? 'bad' : /caution|gap|running|extracting/.test(String(v)) ? 'warn' : 'info';

    async function loadWorkflows() {
      const health = await fetch('/api/health').then(r => r.json());
      $('health').innerHTML = `服务正常 · <code>${esc(health.now)}</code>`;
      const data = await fetch('/api/workflows').then(r => r.json());
      const list = $('workflowList');
      list.innerHTML = data.workflows.map(w => `
        <button class="workflow-button ${w.id === selectedId ? 'active' : ''}" onclick="selectWorkflow('${esc(w.id)}')">
          <strong>${esc(w.paperId)}</strong>
          <span>${esc(w.title || '')}</span>
          <span>state=${esc(w.currentState)} · events=${w.counts?.events ?? 0}</span>
        </button>
      `).join('') || '<p>暂无工作流。请先用 bridge 初始化一篇论文。</p>';
      if (!selectedId && data.workflows[0]) selectWorkflow(data.workflows[0].id);
    }

    async function selectWorkflow(id) {
      selectedId = id;
      await loadWorkflows();
      const wf = await fetch(`/api/workflows/${encodeURIComponent(id)}`).then(r => r.json());
      render(wf);
      connectWs(id);
    }

    function render(wf) {
      const ctx = wf.context || {};
      const gates = ctx.gate_summary || {};
      const queue = ctx.queue_status || {};
      const openRework = Number(wf.counts?.openRework || (ctx.open_rework_tickets || []).length || 0);
      const hardStop = openRework > 0 || ctx.current_state === 'rework_queue' || gates.publication_grade_ready === false;
      $('hero').innerHTML = `
        <h2 class="paper-title">${esc(wf.title || wf.paperId)}</h2>
        <div><code>${esc(wf.paperId)}</code> · workflow <code>${esc(wf.workflowId)}</code></div>
        ${hardStop ? `<div class="stop-banner"><b>最终审批未通过。</b> 当前存在打回/返修或 publication_grade_ready=false；该论文只能进入 rework_queue，不能标记为 publication-grade accepted。</div>` : ''}
        <div class="meta-grid">
          <div class="metric"><label>Current State</label><b>${esc(ctx.current_state)}</b></div>
          <div class="metric"><label>Material</label><b class="${tone(queue.material)}">${esc(queue.material)}</b></div>
          <div class="metric"><label>Analysis</label><b class="${tone(queue.analysis)}">${esc(queue.analysis)}</b></div>
          <div class="metric"><label>Open Rework</label><b class="${openRework ? 'bad' : 'ok'}">${openRework}</b></div>
          ${Object.entries(gates).map(([k,v]) => `<div class="metric"><label>${esc(k)}</label><b class="${tone(v)}">${esc(v)}</b></div>`).join('')}
        </div>`;
      $('states').innerHTML = [...(wf.stateExecutions || [])].reverse().map(s => `
        <div class="item"><small>${esc(s.finished_at || s.created_at)} · ${esc(s.provider)} / ${esc(s.model)} / ${esc(s.reasoning_effort)}</small><b>${esc(s.state)}</b> <span class="${tone(s.status)}">${esc(s.status)}</span><div>${esc(s.output_summary)}</div><div>${(s.artifact_refs || []).map(a => `<code>${esc(a)}</code>`).join(' ')}</div></div>
      `).join('') || '<p>暂无 state execution。</p>';
      $('chat').innerHTML = [...(wf.chatMessages || [])].reverse().map(m => `
        <div class="item"><small>${esc(m.created_at)} · ${esc(m.state)} · ${esc(m.role)}</small>${esc(m.message)}</div>
      `).join('') || '<p>暂无 chat message。</p>';
      const ticketRows = wf.reworkHistory?.length ? wf.reworkHistory : (wf.reworkTickets || []);
      $('rework').innerHTML = [...ticketRows].reverse().map(t => `
        <div class="artifact"><b>${esc(t.ticket_id)} <span class="${tone(t.severity)}">${esc(t.severity)}</span> <span class="${tone(t.resolution_status)}">${esc(t.resolution_status || 'open')}</span></b><div><code>${esc(t.target_queue)}</code> · <code>${esc(t.failure_code)}</code></div><div>${esc(t.reason)}</div><small>${esc(t.required_action || '')}</small><div class="actions"><button class="action warn" onclick="postAction('request_retry', '${esc(wf.id)}', '${esc(t.target_queue || wf.context.current_state)}')">记录返修重跑请求</button><button class="action blue" onclick="postAction('ack_rework', '${esc(wf.id)}', '${esc(t.target_queue || wf.context.current_state)}')">标记已查看</button></div></div>
      `).join('') || '<p>暂无 open rework ticket。</p>';
      $('artifacts').innerHTML = [...(wf.artifacts || [])].reverse().map(a => `
        <div class="artifact"><b>${esc(a.artifact_type)} <span class="${tone(a.status)}">${esc(a.status)}</span></b><code>${esc(a.path)}</code><small>${esc(a.produced_by_state)} · ${esc(a.created_at)}</small><div>${esc(a.summary)}</div></div>
      `).join('') || '<p>暂无 artifact。</p>';
      const combined = [...(wf.events || []), ...(wf.agentLogs || [])].sort((a,b) => String(b.created_at).localeCompare(String(a.created_at)));
      $('events').innerHTML = combined.map(e => `
        <div class="item"><small>${esc(e.created_at)} · ${esc(e.record_type)} · ${esc(e.state || e.category || '')}</small><b>${esc(e.event || e.level || '')}</b><div>${esc(e.message || JSON.stringify(e.payload || {}))}</div></div>
      `).join('') || '<p>暂无 event/log。</p>';
      $('context').textContent = JSON.stringify(ctx, null, 2);
    }

    async function postAction(action, workflowId, state) {
      const res = await fetch(`/api/workflows/${encodeURIComponent(workflowId)}/actions`, {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ action, state, message: `${action} from web panel for ${state}` }),
      });
      const data = await res.json();
      if (data.workflow) render(data.workflow);
      await loadWorkflows();
    }

    function connectWs(id) {
      if (socket) socket.close();
      const protocol = location.protocol === 'https:' ? 'wss' : 'ws';
      socket = new WebSocket(`${protocol}://${location.host}/ws/workflows/${encodeURIComponent(id)}`);
      socket.onopen = () => $('wsState').textContent = 'WS 已连接';
      socket.onclose = () => $('wsState').textContent = 'WS 已断开';
      socket.onerror = () => $('wsState').textContent = 'WS 错误';
      socket.onmessage = (event) => {
        const msg = JSON.parse(event.data);
        if (msg.type === 'workflow_snapshot' && msg.workflow) render(msg.workflow);
      };
    }

    loadWorkflows().catch(err => {
      $('health').textContent = `加载失败：${err.message}`;
      console.error(err);
    });
  </script>
</body>
</html>
